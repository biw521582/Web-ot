<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root { --bg: #121212; --panel: #1E1E1E; --border: #333333; --text: #E0E0E0; --primary: #F59E0B; --danger: #DC2626; --info: #38BDF8; }
    * { touch-action: manipulation; box-sizing: border-box; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
    .header { padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--primary); font-size: 1.2rem; }
    .nav { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
    .nav-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: #666; font-size: 11px; cursor: pointer; }
    .nav-btn.active { color: var(--primary); font-weight: bold; border-bottom: 3px solid var(--primary); }
    .page { display: none; padding: 15px; }
    .page.active { display: block; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 10px 5px; border-bottom: 1px solid #252525; }
    select, input { background: #2A2A2A; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; width: 100%; font-size: 14px; }
    .btn-main { background: var(--primary); color: #000; border: none; border-radius: 8px; padding: 15px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
    .fab { position: fixed; bottom: 100px; right: 20px; width: 60px; height: 60px; background: var(--primary); color: #000; border-radius: 50%; border: none; font-size: 30px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 999; }
    .is-safe { color: #444 !important; text-decoration: line-through; }
    .stat-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; }
    .stat-label { color: #888; }
  </style>
</head>
<body>

<div class="header">EMPLOYEE LIST</div>

<div class="nav">
  <button id="btn-checkin" class="nav-btn active" onclick="nav('checkin')">🏠 เช็คชื่อ</button>
  <button id="btn-fire" class="nav-btn" onclick="nav('fire')">🚨 ฉุกเฉิน</button>
  <button id="btn-stats" class="nav-btn" onclick="nav('stats')">📊 สรุปสถิติ</button>
  <button id="btn-admin" class="nav-btn" onclick="nav('admin')">🔑 แอดมิน</button>
</div>

<button class="fab" onclick="openAddModal()">+</button>

<div id="page-checkin" class="page active">
  <select id="deptSelect" onchange="loadStaff()" style="border: 2px solid var(--primary); margin-bottom: 15px;"><option value="">-- เลือกแผนก --</option><option value="PRESS HYD">PRESS HYD</option><option value="PRESS Automotive">PRESS Automotive</option></select>
  <div class="card"><table><tbody id="checkinTable"></tbody></table></div>
  <button class="btn-main" onclick="saveData()">💾 บันทึกข้อมูลวันนี้</button>
</div>

<div id="page-fire" class="page">
  <div class="card" style="border-left: 5px solid var(--danger);"><h3 style="color:var(--danger); margin-top:0;">🚨 ตรวจยอดคน</h3><table id="fireTable"></table></div>
</div>

<div id="page-stats" class="page">
  <div class="card" style="text-align: center; border-top: 4px solid var(--primary);">
    <h2 style="margin: 0; color: var(--primary); font-size: 2.8rem;" id="val-otPercent">0%</h2>
    <p style="margin: 5px 0 0; color: #888; font-size: 0.8rem;">เปอร์เซ็นต์ทำโอที (เทียบยอดมาทำงาน)</p>
  </div>
  <div class="card">
    <div class="stat-row"><span class="stat-label">พนักงานทั้งหมด (ในระบบ)</span> <b id="val-total">0 คน</b></div>
    <div class="stat-row"><span class="stat-label">มาทำงานวันนี้</span> <b id="val-present" style="color:var(--info);">0 คน</b></div>
    <div class="stat-row"><span class="stat-label">ขาดงาน / ลา</span> <b id="val-absent" style="color:var(--danger);">0 คน</b></div>
    <div class="stat-row" style="border:none;"><span class="stat-label">ยอดพนักงานทำโอที</span> <b id="val-ot" style="color:var(--primary);">0 คน</b></div>
  </div>
  <button class="btn-main" onclick="exportToCSV()" style="background: var(--info);">📥 ดาวน์โหลดรายงาน (CSV)</button>
</div>

<div id="page-admin" class="page">
  <div id="adminLock" class="card" style="text-align:center;"><input type="password" id="adminPass" placeholder="รหัสแอดมิน" style="text-align:center;"><button class="btn-main" onclick="unlockAdmin()">เข้าสู่ระบบ</button></div>
  <div id="adminPanel" style="display:none;"><div id="approvalQueue"></div></div>
</div>

<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center;">
  <div class="card" style="width:90%; max-width:380px;"><h3 id="modalTitle" style="color:var(--primary); margin-top:0;"></h3><input type="hidden" id="f_oldId"><label>รหัสพนักงาน</label><input type="text" id="f_id"><label>ชื่อ-นามสกุล</label><input type="text" id="f_name"><label>สายรถ</label><input type="text" id="f_bus"><div id="editSection" style="display:none;"><label style="color:var(--danger);">เหตุผล *</label><input type="text" id="f_reason"></div><button class="btn-main" onclick="submitModal()">ยืนยัน</button><button onclick="closeModal()" style="background:none; border:none; color:#888; width:100%; margin-top:15px;">ยกเลิก</button></div>
</div>

<script>
  // 🔗 วาง Web App URL ของพี่ตรงนี้ครับ!
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwXXjuO5jyD4ayJ8SO8jFtCpMLObxmzmhhQV7QhstaOh66V09wyqodxSqAEJuCkVQ7QhA/exec";

  let employees = [];

  async function callGoogle(payload) {
    const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
    return await response.json();
  }

  function nav(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    document.getElementById('btn-'+id).classList.add('active');
    if(id === 'stats') updateStats();
  }

  function hStatus(i) {
    const s = document.getElementsByClassName('am-s')[i]; const o = document.getElementsByClassName('ot-s')[i];
    if (s.value !== "มา") { o.value = "17:00|0"; o.disabled = true; o.style.opacity = "0.4"; }
    else { o.disabled = false; o.style.opacity = "1"; }
  }

  async function loadStaff() {
    const dept = document.getElementById('deptSelect').value;
    const res = await callGoogle({ action: 'getStaff', dept: dept });
    employees = res; let cHtml = ''; let fHtml = '';
    res.forEach((emp, i) => {
      cHtml += `<tr><td onclick="openEditModal(${i})"><b style="color:var(--primary)">${emp[1]}</b><br><small style="color:#666">${emp[0]}</small></td><td><select class="am-s" onchange="hStatus(${i})"><option value="มา">มา</option><option value="ขาด">ขาด</option><option value="ลา">ลา</option></select></td><td><select class="ot-s"><option value="17:00|0">17:00 (ไม่ทำ)</option><option value="20:30|3">20:30 (3)</option><option value="21:30|4">21:30 (4)</option><option value="22:30|5">22:30 (5)</option><option value="23:30|6">23:30 (6)</option><option value="00:00|6.5">00:00 (6.5)</option></select></td></tr>`;
      fHtml += `<tr><td id="f-row-${i}" style="color:var(--danger); font-weight:bold;">${emp[1]}<br><small style="color:var(--primary)">${emp[2]} | ${emp[0]}</small></td><td width="35" align="right"><input type="checkbox" onchange="document.getElementById('f-row-${i}').classList.toggle('is-safe', this.checked)"></td></tr>`;
    });
    document.getElementById('checkinTable').innerHTML = cHtml;
    document.getElementById('fireTable').innerHTML = fHtml;
  }

  async function updateStats() {
    const s = await callGoogle({ action: 'getStats' });
    document.getElementById('val-otPercent').innerText = s.otPercent + "%";
    document.getElementById('val-total').innerText = s.total + " คน";
    document.getElementById('val-present').innerText = s.present + " คน";
    document.getElementById('val-absent').innerText = s.absent + " คน";
    document.getElementById('val-ot').innerText = s.otCount + " คน";
  }

  async function saveData() {
    const d = document.getElementById('deptSelect').value; if(!d) return alert("เลือกแผนกก่อน!");
    const records = []; document.querySelectorAll('#checkinTable tr').forEach((row, i) => {
      const ot = row.querySelector('.ot-s').value.split('|');
      records.push({ id: employees[i][0], name: employees[i][1], dept: d, status: row.querySelector('.am-s').value, untilTime: ot[0], otHours: ot[1], note: "" });
    });
    const res = await callGoogle({ action: 'saveDaily', records: records });
    alert(res.success ? "บันทึกเรียบร้อย!" : "ผิดพลาด");
  }

  async function exportToCSV() {
    const data = await callGoogle({ action: 'exportData' });
    let csv = "\uFEFFวันที่,รหัสพนักงาน,ชื่อ,แผนก,สถานะเช้า,เวลาโอที,ชั่วโมงโอที\n";
    for(let i=1; i<data.am.length; i++) {
      let r = data.am[i]; let otMatch = data.ot.find(o => new Date(o[0]).toDateString() === new Date(r[0]).toDateString() && o[1] == r[1]);
      csv += `${new Date(r[0]).toLocaleDateString('th-TH')},${r[1]},${r[2]},${r[3]},${r[4]},${otMatch?otMatch[5]:"17:00"},${otMatch?otMatch[6]:"0"}\n`;
    }
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Report.csv`; link.click();
  }

  function unlockAdmin() { if(document.getElementById('adminPass').value === '521582') { document.getElementById('adminLock').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; refreshQueue(); } else alert('รหัสผิด'); }
  async function refreshQueue() { 
    const q = await callGoogle({ action: 'getPending' });
    let h = ''; q.forEach(r => { h += `<div class="card"><b>ขอแก้:</b> ${r[3]}<br><button class="btn-main" onclick="approve('${r[1]}','Approve',{id:'${r[2]}',name:'${r[3]}',bus:'${r[4]}'})">Approve</button></div>`; });
    document.getElementById('approvalQueue').innerHTML = h || 'ไม่มีรายการ';
  }
  async function approve(id, action, data) { await callGoogle({ action: 'approveEdit', oldId: id, res: action, newData: data }); alert("ดำเนินการแล้ว"); refreshQueue(); }
  function closeModal() { document.getElementById('modal').style.display = 'none'; }
  function openAddModal() { document.getElementById('modalTitle').innerText = "เพิ่มพนักงาน"; document.getElementById('editSection').style.display = "none"; document.getElementById('modal').style.display = "flex"; }
  function openEditModal(i) { const e = employees[i]; document.getElementById('f_oldId').value = e[0]; document.getElementById('f_id').value = e[0]; document.getElementById('f_name').value = e[1]; document.getElementById('f_bus').value = e[3]; document.getElementById('modalTitle').innerText = "ขอแก้ข้อมูล"; document.getElementById('editSection').style.display = "block"; document.getElementById('modal').style.display = "flex"; }
  async function submitModal() {
    const d = { id: document.getElementById('f_id').value, name: document.getElementById('f_name').value, bus: document.getElementById('f_bus').value, dept: document.getElementById('deptSelect').value || "PRESS HYD" };
    if(document.getElementById('editSection').style.display === "none") { await callGoogle({ action: 'addStaff', empData: d }); }
    else { d.oldId = document.getElementById('f_oldId').value; d.reason = document.getElementById('f_reason').value; await callGoogle({ action: 'reqEdit', d: d }); }
    closeModal(); alert("สำเร็จ"); loadStaff();
  }
</script>
</body>
</html>
