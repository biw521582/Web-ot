<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจัดการ OT พนักงาน</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            max-height: 100vh;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            overflow-x: hidden;
            font-family: 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #DFF2EE;
            color: #45462A;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        body {
            box-sizing: border-box;
        }

        /* ==========================================
           MAIN CONTAINER - FIXED VIEWPORT
        ========================================== */
        .app-container {
            height: 100vh;
            max-height: 100vh;
            width: 100%;
            max-width: 100vw;
            display: flex;
            flex-direction: column;
            background: 
                radial-gradient(circle at 20% 30%, rgba(116, 7, 14, 0.08), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(148, 114, 104, 0.06), transparent 55%),
                repeating-linear-gradient(
                    0deg,
                    rgba(244, 227, 178, 0.015) 0px,
                    transparent 2px,
                    transparent 12px,
                    rgba(148, 114, 104, 0.01) 14px
                ),
                linear-gradient(165deg, #310E10 0%, #45462A 100%);
            overflow: hidden;
            overflow-x: hidden;
        }

        /* ==========================================
           TOP BAR - FIXED HEIGHT
        ========================================== */
        .top-bar {
            flex-shrink: 0;
            background: 
                radial-gradient(circle at 50% 120%, rgba(116, 7, 14, 0.12), transparent 50%),
                repeating-linear-gradient(
                    90deg,
                    rgba(244, 227, 178, 0.02) 0px,
                    transparent 2px,
                    transparent 6px,
                    rgba(148, 114, 104, 0.015) 8px
                ),
                rgba(69, 70, 42, 0.98);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid rgba(148, 114, 104, 0.3);
            padding: 12px 16px;
            box-shadow: 
                0 4px 16px rgba(49, 14, 16, 0.5),
                inset 0 1px 0 rgba(244, 227, 178, 0.08);
            width: 100%;
            max-width: 100vw;
        }

        .app-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #F4E3B2;
            text-align: center;
            line-height: 1.3;
            text-shadow: 
                0 2px 4px rgba(49, 14, 16, 0.5),
                0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* ==========================================
           TAB NAVIGATION - FIXED HEIGHT
        ========================================== */
        .tab-nav {
            flex-shrink: 0;
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: 
                radial-gradient(circle at 70% 50%, rgba(116, 7, 14, 0.08), transparent 60%),
                rgba(49, 14, 16, 0.6);
            border-bottom: 1px solid rgba(148, 114, 104, 0.25);
            width: 100%;
            max-width: 100vw;
        }

        .tab-btn {
            flex: 1;
            min-width: 0;
            padding: 12px 8px;
            background: 
                radial-gradient(circle at 50% 50%, rgba(69, 70, 42, 0.3), transparent 70%),
                rgba(69, 70, 42, 0.5);
            color: #F4E3B2;
            border: 1px solid rgba(148, 114, 104, 0.3);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 2px 6px rgba(49, 14, 16, 0.3),
                inset 0 1px 0 rgba(244, 227, 178, 0.05);
        }

        .tab-btn:hover {
            background: 
                radial-gradient(circle at 50% 50%, rgba(69, 70, 42, 0.5), transparent 65%),
                rgba(69, 70, 42, 0.7);
            color: #F4E3B2;
            border-color: rgba(148, 114, 104, 0.5);
            box-shadow: 
                0 3px 10px rgba(49, 14, 16, 0.4),
                0 0 12px rgba(116, 7, 14, 0.2);
        }

        .tab-btn.active {
            background: 
                radial-gradient(circle at 50% 50%, rgba(244, 227, 178, 0.25), transparent 70%),
                radial-gradient(circle at 80% 20%, rgba(148, 114, 104, 0.15), transparent 65%),
                rgba(244, 227, 178, 0.95);
            color: #310E10;
            border-color: rgba(148, 114, 104, 0.6);
            box-shadow: 
                inset 0 2px 8px rgba(148, 114, 104, 0.2),
                0 0 16px rgba(244, 227, 178, 0.3),
                0 4px 12px rgba(49, 14, 16, 0.4);
            font-weight: 600;
        }

        /* ==========================================
           DEPARTMENT SELECTOR - FIXED HEIGHT
        ========================================== */
        .dept-selector {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            background: 
                radial-gradient(circle at 30% 50%, rgba(116, 7, 14, 0.06), transparent 65%),
                rgba(49, 14, 16, 0.5);
            border-bottom: 1px solid rgba(148, 114, 104, 0.2);
            width: 100%;
            max-width: 100vw;
        }

        .dept-btn {
            flex: 1;
            min-width: 0;
            padding: 10px 16px;
            background: 
                radial-gradient(circle at 50% 50%, rgba(69, 70, 42, 0.25), transparent 70%),
                rgba(69, 70, 42, 0.4);
            color: #F4E3B2;
            border: 1px solid rgba(148, 114, 104, 0.3);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 42px;
            box-shadow: 
                0 2px 6px rgba(49, 14, 16, 0.3),
                inset 0 1px 0 rgba(244, 227, 178, 0.05);
        }

        .dept-btn:hover {
            background: 
                radial-gradient(circle at 50% 50%, rgba(69, 70, 42, 0.4), transparent 65%),
                rgba(69, 70, 42, 0.6);
            color: #F4E3B2;
            box-shadow: 
                0 3px 8px rgba(49, 14, 16, 0.4),
                0 0 10px rgba(116, 7, 14, 0.15);
        }

        .dept-btn.active {
            background: 
                radial-gradient(circle at 50% 50%, rgba(244, 227, 178, 0.22), transparent 65%),
                radial-gradient(circle at 100% 0%, rgba(148, 114, 104, 0.12), transparent 70%),
                rgba(244, 227, 178, 0.92);
            color: #310E10;
            border-color: rgba(148, 114, 104, 0.55);
            box-shadow: 
                0 0 14px rgba(244, 227, 178, 0.25),
                0 3px 10px rgba(49, 14, 16, 0.4);
            font-weight: 600;
        }

        /* ==========================================
           SUMMARY PANEL - FIXED HEIGHT (1x4 Grid)
        ========================================== */
        .summary-panel {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 10px 16px;
            background: 
                radial-gradient(circle at 50% 50%, rgba(116, 7, 14, 0.08), transparent 65%),
                rgba(49, 14, 16, 0.4);
            border-bottom: 1px solid rgba(148, 114, 104, 0.2);
            width: 100%;
            max-width: 100vw;
        }

        .summary-card {
            background: 
                radial-gradient(circle at 50% 50%, rgba(244, 227, 178, 0.15), transparent 75%),
                repeating-linear-gradient(
                    135deg,
                    rgba(148, 114, 104, 0.03) 0px,
                    transparent 2px,
                    transparent 6px,
                    rgba(116, 7, 14, 0.015) 8px
                ),
                rgba(244, 227, 178, 0.95);
            border: 2px solid rgba(148, 114, 104, 0.4);
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
            transition: all 0.2s ease;
            min-width: 0;
            box-shadow: 
                0 4px 12px rgba(49, 14, 16, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .summary-card:hover {
            background: 
                radial-gradient(circle at 50% 50%, rgba(244, 227, 178, 0.25), transparent 70%),
                rgba(244, 227, 178, 1);
            border-color: rgba(148, 114, 104, 0.6);
            transform: translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(49, 14, 16, 0.5),
                0 0 24px rgba(116, 7, 14, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .summary-label {
            font-size: 11px;
            color: #310E10;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.75;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .summary-number {
            font-size: 28px;
            font-weight: 700;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            color: #310E10;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(49, 14, 16, 0.15);
        }

        .summary-card.highlight .summary-number { color: #310E10; }
        .summary-card.success .summary-number { color: #45462A; }
        .summary-card.warning .summary-number { 
            color: #74070E;
            text-shadow: 0 2px 4px rgba(116, 7, 14, 0.25);
        }
        .summary-card.muted .summary-number { color: #947268; }

        /* ==========================================
           CONTENT AREA - FLEXIBLE + SCROLLABLE
        ========================================== */
        .content-area {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
            width: 100%;
            max-width: 100%;
        }

        /* ==========================================
           ACTION BAR - FIXED HEIGHT
        ========================================== */
        .action-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: flex-end;
            padding: 10px 16px;
            background: 
                radial-gradient(circle at 80% 50%, rgba(116, 7, 14, 0.06), transparent 60%),
                rgba(49, 14, 16, 0.35);
            border-bottom: 1px solid rgba(148, 114, 104, 0.2);
            width: 100%;
            max-width: 100vw;
        }

        .btn-add {
            padding: 12px 24px;
            background: 
                radial-gradient(circle at 50% 50%, rgba(116, 7, 14, 0.4), transparent 75%),
                radial-gradient(circle at 100% 0%, rgba(148, 114, 104, 0.2), transparent 65%),
                rgba(116, 7, 14, 0.95);
            color: #F4E3B2;
            border: 2px solid rgba(148, 114, 104, 0.5);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: 
                0 4px 14px rgba(116, 7, 14, 0.4),
                inset 0 1px 0 rgba(244, 227, 178, 0.1);
            min-height: 44px;
            text-shadow: 0 2px 4px rgba(49, 14, 16, 0.5);
            letter-spacing: 0.3px;
        }

        .btn-add:hover {
            background: 
                radial-gradient(circle at 50% 50%, rgba(116, 7, 14, 0.55), transparent 70%),
                radial-gradient(circle at 100% 0%, rgba(148, 114, 104, 0.3), transparent 60%),
                rgba(116, 7, 14, 1);
            box-shadow: 
                0 6px 20px rgba(116, 7, 14, 0.6),
                0 0 30px rgba(116, 7, 14, 0.3),
                inset 0 1px 0 rgba(244, 227, 178, 0.15);
            border-color: rgba(148, 114, 104, 0.7);
            transform: translateY(-2px);
        }

        /* ==========================================
           TABLE CONTAINER - SCROLLABLE ONLY
        ========================================== */
        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            min-height: 0;
            background: 
                radial-gradient(circle at 50% 0%, rgba(116, 7, 14, 0.06), transparent 55%),
                rgba(49, 14, 16, 0.3);
            -webkit-overflow-scrolling: touch;
            width: 100%;
            max-width: 100vw;
        }

        .data-table {
            width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background: 
                radial-gradient(circle at 50% 50%, rgba(116, 7, 14, 0.12), transparent 60%),
                repeating-linear-gradient(
                    90deg,
                    rgba(244, 227, 178, 0.02) 0px,
                    transparent 2px,
                    transparent 5px,
                    rgba(148, 114, 104, 0.015) 7px
                ),
                rgba(69, 70, 42, 0.98);
            box-shadow: 0 4px 12px rgba(49, 14, 16, 0.5);
        }

        .data-table th {
            padding: 12px 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: #F4E3B2;
            border-right: 1px solid rgba(148, 114, 104, 0.25);
            border-bottom: 2px solid rgba(148, 114, 104, 0.4);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(49, 14, 16, 0.5);
        }

        .data-table th:last-child {
            border-right: none;
        }

        .data-table td {
            padding: 12px 10px;
            border-right: 1px solid rgba(148, 114, 104, 0.15);
            border-bottom: 1px solid rgba(148, 114, 104, 0.2);
            font-size: 13px;
            color: #310E10;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(244, 227, 178, 0.08), transparent 80%),
                rgba(244, 227, 178, 0.92);
        }

        .data-table td:last-child {
            border-right: none;
        }

        .data-table tbody tr {
            transition: all 0.2s ease;
        }

        .data-table tbody tr:hover {
            background: 
                radial-gradient(circle at 50% 50%, rgba(116, 7, 14, 0.08), transparent 75%),
                rgba(244, 227, 178, 1);
            box-shadow: 
                0 0 16px rgba(116, 7, 14, 0.25),
                inset 0 0 20px rgba(148, 114, 104, 0.1);
        }

        .data-table tbody tr.locked {
            opacity: 0.5;
            background: rgba(148, 114, 104, 0.2);
        }

        /* ==========================================
           CODE ELLIPSIS (... clickable)
        ========================================== */
        .code-ellipsis {
            cursor: pointer;
            color: #74070E;
            font-weight: 700;
            text-decoration: underline;
            text-decoration-style: dotted;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: inline-block;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .code-ellipsis:hover {
            background: rgba(116, 7, 14, 0.15);
            transform: scale(1.15);
        }

        /* ==========================================
           TOOLTIP POPUP
        ========================================== */
        .tooltip-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(49, 14, 16, 0.88);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            animation: fadeIn 0.2s ease;
        }

        .tooltip-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tooltip-content {
            background: 
                radial-gradient(circle at 50% 0%, rgba(116, 7, 14, 0.08), transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(148, 114, 104, 0.1), transparent 60%),
                rgba(244, 227, 178, 0.98);
            border: 2px solid rgba(148, 114, 104, 0.5);
            border-radius: 12px;
            padding: 20px;
            max-width: 360px;
            width: 88%;
            box-shadow: 
                0 20px 60px rgba(49, 14, 16, 0.6),
                0 0 80px rgba(116, 7, 14, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(148, 114, 104, 0.3);
        }

        .tooltip-title {
            font-size: 16px;
            font-weight: 700;
            color: #310E10;
            letter-spacing: 0.3px;
        }

        .tooltip-close {
            width: 36px;
            height: 36px;
            background: rgba(148, 114, 104, 0.5);
            color: #F4E3B2;
            border: 2px solid rgba(148, 114, 104, 0.6);
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            min-height: 36px;
            min-width: 36px;
            flex-shrink: 0;
        }

        .tooltip-close:hover {
            background: rgba(148, 114, 104, 0.7);
            transform: scale(1.1);
        }

        .info-flow {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-node {
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.25), transparent 70%),
                rgba(255, 255, 255, 0.92);
            border: 2px solid rgba(148, 114, 104, 0.35);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(49, 14, 16, 0.15);
        }

        .info-node:hover {
            border-color: rgba(116, 7, 14, 0.45);
            box-shadow: 0 4px 12px rgba(49, 14, 16, 0.25);
            transform: translateX(4px);
        }

        .info-arrow {
            font-size: 18px;
            color: #74070E;
            font-weight: 700;
            flex-shrink: 0;
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: #947268;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 70px;
            flex-shrink: 0;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #310E10;
            flex: 1;
            word-break: break-word;
        }

        /* ==========================================
           REMARK BUTTON
        ========================================== */
        .remark-btn {
            padding: 8px 14px;
            background: 
                radial-gradient(circle at 50% 50%, rgba(69, 70, 42, 0.25), transparent 70%),
                rgba(69, 70, 42, 0.9);
            color: #F4E3B2;
            border: 2px solid rgba(148, 114, 104, 0.5);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            min-height: 44px;
            box-shadow: 0 2px 6px rgba(49, 14, 16, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .remark-btn:hover {
            background: 
                radial-gradient(circle at 50% 50%, rgba(69, 70, 42, 0.35), transparent 65%),
                rgba(69, 70, 42, 1);
            box-shadow: 0 4px 10px rgba(49, 14, 16, 0.4);
            transform: translateY(-1px);
        }

        .remark-btn.has-remark {
            background: 
                radial-gradient(circle at 50% 50%, rgba(116, 7, 14, 0.3), transparent 70%),
                rgba(116, 7, 14, 0.9);
            border-color: rgba(148, 114, 104, 0.6);
        }

        .remark-btn.has-remark:hover {
            background: 
                radial-gradient(circle at 50% 50%, rgba(116, 7, 14, 0.4), transparent 65%),
                rgba(116, 7, 14, 1);
        }

        .remark-btn.required {
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 2px 6px rgba(49, 14, 16, 0.3);
            }
            50% { 
                box-shadow: 0 0 0 4px rgba(116, 7, 14, 0.3),
                           0 4px 12px rgba(116, 7, 14, 0.5);
            }
        }

        /* ==========================================
           REMARK POPUP
        ========================================== */
        .remark-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(49, 14, 16, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1600;
        }

        .remark-popup.show {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .remark-popup-content {
            background: 
                radial-gradient(circle at 50% 0%, rgba(116, 7, 14, 0.08), transparent 55%),
                rgba(244, 227, 178, 0.98);
            border: 2px solid rgba(148, 114, 104, 0.5);
            border-radius: 12px;
            padding: 20px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(49, 14, 16, 0.6);
            animation: slideUp 0.3s ease;
        }

        .remark-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(148, 114, 104, 0.3);
        }

        .remark-popup-title {
            font-size: 16px;
            font-weight: 700;
            color: #310E10;
            flex: 1;
        }

        .remark-textarea {
            width: 100%;
            max-width: 100%;
            min-height: 120px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.95);
            color: #310E10;
            border: 2px solid rgba(148, 114, 104, 0.4);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            resize: vertical;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .remark-textarea:focus {
            outline: none;
            border-color: rgba(116, 7, 14, 0.6);
            box-shadow: 0 0 0 3px rgba(116, 7, 14, 0.15);
        }

        .remark-popup-footer {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .remark-popup-footer button {
            flex: 1;
            min-height: 48px;
        }

        /* ==========================================
           STATUS BADGE
        ========================================== */
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid;
            letter-spacing: 0.5px;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        .status-badge.present { 
            background:

  <script>
        // ==========================================
        // Prevent Zoom (ล็อคไม่ให้ซูม)
        // ==========================================
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // ==========================================
        // STORAGE ADAPTER
        // ==========================================
        class StorageAdapter {
            async load() {
                throw new Error('load() must be implemented');
            }
            
            async save(data) {
                throw new Error('save() must be implemented');
            }
            
            async backup() {
                throw new Error('backup() must be implemented');
            }
        }

        class LocalStorageAdapter extends StorageAdapter {
            constructor(storageKey, backupKey) {
                super();
                this.storageKey = storageKey;
                this.backupKey = backupKey;
            }

            async load() {
                try {
                    const dataString = localStorage.getItem(this.storageKey);
                    
                    if (!dataString) {
                        return { employees: [], nextId: 1 };
                    }
                    
                    const data = JSON.parse(dataString);
                    
                    if (!this.validateData(data)) {
                        console.warn('Invalid data detected, attempting backup restore...');
                        return await this.restoreFromBackup();
                    }
                    
                    return data;
                } catch (error) {
                    console.error('Error loading from storage:', error);
                    return await this.restoreFromBackup();
                }
            }

            async save(data) {
                try {
                    await this.backup();
                    
                    const dataString = JSON.stringify(data);
                    localStorage.setItem(this.storageKey, dataString);
                    return true;
                } catch (error) {
                    console.error('Error saving to storage:', error);
                    return false;
                }
            }

            async backup() {
                try {
                    const oldData = localStorage.getItem(this.storageKey);
                    if (oldData) {
                        localStorage.setItem(this.backupKey, oldData);
                    }
                    return true;
                } catch (error) {
                    console.error('Error creating backup:', error);
                    return false;
                }
            }

            async restoreFromBackup() {
                try {
                    const backupString = localStorage.getItem(this.backupKey);
                    
                    if (!backupString) {
                        return { employees: [], nextId: 1 };
                    }
                    
                    const backup = JSON.parse(backupString);
                    
                    if (!this.validateData(backup)) {
                        return { employees: [], nextId: 1 };
                    }
                    
                    await this.save(backup);
                    showToast('✅ กู้คืนข้อมูลจาก Backup สำเร็จ', 'success');
                    return backup;
                } catch (error) {
                    console.error('Error restoring from backup:', error);
                    return { employees: [], nextId: 1 };
                }
            }

            validateData(data) {
                if (!data || !data.employees || !Array.isArray(data.employees)) {
                    return false;
                }
                
                return data.employees.every(emp => 
                    emp &&
                    typeof emp.id === 'number' &&
                    typeof emp.code === 'string' &&
                    typeof emp.name === 'string' &&
                    typeof emp.bus === 'string' &&
                    typeof emp.department === 'string' &&
                    typeof emp.workType === 'string' &&
                    typeof emp.ot === 'string' &&
                    typeof emp.status === 'string' &&
                    typeof emp.remark === 'string' &&
                    typeof emp.checked === 'boolean' &&
                    typeof emp.updatedAt === 'string'
                );
            }
        }

        // ==========================================
        // Global State Management
        // ==========================================
        let employees = [];
        let currentPage = 'ot';
        let currentDept = 'PRESS_AUTO';
        let nextId = 1;
        let editingId = null;
        let currentRemarkEmployeeId = null;

        const storage = new LocalStorageAdapter('ot_employees_data', 'ot_employees_backup');

        // ==========================================
        // XSS Protection
        // ==========================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==========================================
        // Data Persistence
        // ==========================================
        async function saveData() {
            const success = await storage.save({
                employees: employees,
                nextId: nextId
            });
            
            if (!success) {
                showToast('⚠️ ไม่สามารถบันทึกข้อมูลได้', 'error');
            }
            
            return success;
        }

        async function loadData() {
            const data = await storage.load();
            employees = data.employees;
            nextId = data.nextId || 1;
        }

        // ==========================================
        // Tooltip Functions
        // ==========================================
        function openTooltip(empId) {
            const emp = employees.find(e => e.id === empId);
            if (!emp) return;

            const flow = document.getElementById('tooltipFlow');
            const statusName = getStatusName(emp.status);
            const workTypeName = getWorkTypeName(emp.workType);
            
            flow.innerHTML = `
                <div class="info-node">
                    <div class="info-arrow">→</div>
                    <div class="info-label">รหัส</div>
                    <div class="info-value">${escapeHtml(emp.code)}</div>
                </div>
                <div class="info-node">
                    <div class="info-arrow">→</div>
                    <div class="info-label">ชื่อ</div>
                    <div class="info-value">${escapeHtml(emp.name)}</div>
                </div>
                <div class="info-node">
                    <div class="info-arrow">→</div>
                    <div class="info-label">สายรถ</div>
                    <div class="info-value">${escapeHtml(emp.bus)}</div>
                </div>
                <div class="info-node">
                    <div class="info-arrow">→</div>
                    <div class="info-label">OT</div>
                    <div class="info-value">${escapeHtml(emp.ot)}</div>
                </div>
                <div class="info-node">
                    <div class="info-arrow">→</div>
                    <div class="info-label">ประเภท</div>
                    <div class="info-value">${escapeHtml(workTypeName)}</div>
                </div>
                <div class="info-node">
                    <div class="info-arrow">→</div>
                    <div class="info-label">สถานะ</div>
                    <div class="info-value">${escapeHtml(statusName)}</div>
                </div>
                ${emp.remark ? `
                <div class="info-node">
                    <div class="info-arrow">→</div>
                    <div class="info-label">หมายเหตุ</div>
                    <div class="info-value">${escapeHtml(emp.remark)}</div>
                </div>
                ` : ''}
            `;

            document.getElementById('tooltipOverlay').classList.add('show');
        }

        function closeTooltip() {
            document.getElementById('tooltipOverlay').classList.remove('show');
        }

        // ==========================================
        // Remark Popup Functions
        // ==========================================
        function openRemarkPopup(empId) {
            const emp = employees.find(e => e.id === empId);
            if (!emp) return;

            currentRemarkEmployeeId = empId;
            document.getElementById('remarkTextarea').value = emp.remark || '';
            document.getElementById('remarkPopup').classList.add('show');
            
            // Auto-focus textarea
            setTimeout(() => {
                document.getElementById('remarkTextarea').focus();
            }, 300);
        }

        function closeRemarkPopup() {
            document.getElementById('remarkPopup').classList.remove('show');
            currentRemarkEmployeeId = null;
        }

        function saveRemark() {
            if (currentRemarkEmployeeId === null) return;

            const emp = employees.find(e => e.id === currentRemarkEmployeeId);
            if (!emp) return;

            const newRemark = document.getElementById('remarkTextarea').value.trim();
            
            const needsRemark = emp.status === 'L' || emp.status === 'A' || emp.status === 'T';
            
            if (needsRemark && !newRemark) {
                showToast('⚠️ กรุณากรอกหมายเหตุก่อนบันทึก', 'error');
                return;
            }

            emp.remark = newRemark;
            emp.updatedAt = new Date().toISOString();
            saveData();
            closeRemarkPopup();
            
            if (currentPage === 'status') {
                renderStatusPage();
            }
            
            showToast('✅ บันทึกหมายเหตุแล้ว', 'success');
        }

        // ==========================================
        // Page & Department Switching
        // ==========================================
        function switchPage(page, btnElement) {
            currentPage = page;
            
            const allNavBtns = document.querySelectorAll('.tab-btn');
            allNavBtns.forEach(function(btn) {
                btn.classList.remove('active');
            });
            btnElement.classList.add('active');
            
            const allPages = document.querySelectorAll('.page');
            allPages.forEach(function(p) {
                p.classList.remove('active');
            });
            document.getElementById(page + 'Page').classList.add('active');
            
            // Hide department selector on report page
            const deptSelector = document.getElementById('deptSelector');
            deptSelector.style.display = (page === 'report') ? 'none' : 'flex';
            
            if (page === 'ot') {
                renderOTPage();
            } else if (page === 'status') {
                renderStatusPage();
            } else if (page === 'report') {
                renderReportPage();
            }
        }

        function switchDept(dept, btnElement) {
            currentDept = dept;
            
            const allDeptBtns = document.querySelectorAll('.dept-btn');
            allDeptBtns.forEach(function(btn) {
                btn.classList.remove('active');
            });
            btnElement.classList.add('active');
            
            if (currentPage === 'ot') {
                renderOTPage();
            } else if (currentPage === 'status') {
                renderStatusPage();
            }
        }

        function getCurrentDeptEmployees() {
            return employees.filter(function(emp) {
                return emp.department === currentDept;
            });
        }

        // ==========================================
        // OT Page Rendering
        // ==========================================
        function renderOTPage() {
            const deptEmployees = getCurrentDeptEmployees();
            
            const total = deptEmployees.length;
            const withOT = deptEmployees.filter(function(emp) {
                return emp.ot !== '17:00' && emp.status !== 'L' && emp.status !== 'A';
            }).length;
            const withoutOT = deptEmployees.filter(function(emp) {
                return emp.ot === '17:00' || emp.status === 'L' || emp.status === 'A';
            }).length;
            const helping = deptEmployees.filter(function(emp) {
                return (emp.workType === 'help_dept' || emp.workType === 'help_project') &&
                       emp.status !== 'L' && emp.status !== 'A';
            }).length;
            
            document.getElementById('otSummaryTotal').textContent = total;
            document.getElementById('otSummaryWithOT').textContent = withOT;
            document.getElementById('otSummaryWithoutOT').textContent = withoutOT;
            document.getElementById('otSummaryHelping').textContent = helping;
            
            const tbody = document.getElementById('otTableBody');
            
            if (deptEmployees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">ยังไม่มีพนักงานในแผนกนี้</div></div></td></tr>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < deptEmployees.length; i++) {
                const emp = deptEmployees[i];
                const isLocked = emp.status === 'L' || emp.status === 'A';
                const statusClass = getStatusClass(emp.status);
                const workTypeClass = (emp.workType === 'help_dept' || emp.workType === 'help_project') ? 'helping' : '';
                const otClass = emp.ot === '17:00' ? 'ot-no' : 'ot-yes';
                
                html += '<tr class="' + (isLocked ? 'locked' : '') + '">';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td><span class="code-ellipsis" onclick="openTooltip(' + emp.id + ')">...</span></td>';
                html += '<td>' + escapeHtml(emp.name) + '</td>';
                html += '<td><span class="status-badge ' + statusClass + '">' + escapeHtml(emp.status) + '</span></td>';
                html += '<td>' + escapeHtml(emp.bus) + '</td>';
                html += '<td><select class="control-select ' + workTypeClass + '" onchange="updateWorkType(' + emp.id + ', this.value)" ' + (isLocked ? 'disabled' : '') + '>';
                html += '<option value="press" ' + (emp.workType === 'press' ? 'selected' : '') + '>Press</option>';
                html += '<option value="help_dept" ' + (emp.workType === 'help_dept' ? 'selected' : '') + '>ช่วยแผนก</option>';
                html += '<option value="help_project" ' + (emp.workType === 'help_project' ? 'selected' : '') + '>ช่วยโปร</option>';
                html += '</select></td>';
                html += '<td><select class="control-select ' + otClass + '" onchange="updateOT(' + emp.id + ', this.value)" ' + (isLocked ? 'disabled' : '') + '>';
                html += '<option value="17:00" ' + (emp.ot === '17:00' ? 'selected' : '') + '>17:00</option>';
                html += '<option value="20:30" ' + (emp.ot === '20:30' ? 'selected' : '') + '>20:30</option>';
                html += '<option value="21:30" ' + (emp.ot === '21:30' ? 'selected' : '') + '>21:30</option>';
                html += '<option value="22:30" ' + (emp.ot === '22:30' ? 'selected' : '') + '>22:30</option>';
                html += '<option value="23:30" ' + (emp.ot === '23:30' ? 'selected' : '') + '>23:30</option>';
                html += '</select></td>';
                html += '<td><button class="btn-edit" onclick="editEmployee(' + emp.id + ')" ' + (isLocked ? 'disabled' : '') + '>แก้ไข</button></td>';
                html += '</tr>';
            }
            
            tbody.innerHTML = html;
        }

        // ==========================================
        // Status Page Rendering
        // ==========================================
        function renderStatusPage() {
            const deptEmployees = getCurrentDeptEmployees();
            
            const present = deptEmployees.filter(function(emp) { return emp.status === 'P'; }).length;
            const leave = deptEmployees.filter(function(emp) { return emp.status === 'L'; }).length;
            const absent = deptEmployees.filter(function(emp) { return emp.status === 'A'; }).length;
            const late = deptEmployees.filter(function(emp) { return emp.status === 'T'; }).length;
            
            document.getElementById('statusSummaryPresent').textContent = present;
            document.getElementById('statusSummaryLeave').textContent = leave;
            document.getElementById('statusSummaryAbsent').textContent = absent;
            document.getElementById('statusSummaryLate').textContent = late;
            
            const tbody = document.getElementById('statusTableBody');
            
            if (deptEmployees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">✅</div><div class="empty-state-text">ยังไม่มีพนักงานในแผนกนี้</div></div></td></tr>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < deptEmployees.length; i++) {
                const emp = deptEmployees[i];
                const statusClass = getStatusClass(emp.status);
                const needsRemark = emp.status === 'L' || emp.status === 'A' || emp.status === 'T';
                const hasRemark = emp.remark && emp.remark.trim();
                
                html += '<tr>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td><span class="code-ellipsis" onclick="openTooltip(' + emp.id + ')">...</span></td>';
                html += '<td>' + escapeHtml(emp.name) + '</td>';
                html += '<td>' + escapeHtml(emp.bus) + '</td>';
                html += '<td><select class="control-select ' + statusClass + '" onchange="updateStatus(' + emp.id + ', this.value)">';
                html += '<option value="P" ' + (emp.status === 'P' ? 'selected' : '') + '>P - มาทำงาน</option>';
                html += '<option value="L" ' + (emp.status === 'L' ? 'selected' : '') + '>L - ลา</option>';
                html += '<option value="A" ' + (emp.status === 'A' ? 'selected' : '') + '>A - ขาด</option>';
                html += '<option value="T" ' + (emp.status === 'T' ? 'selected' : '') + '>T - มาสาย</option>';
                html += '</select></td>';
                
                if (needsRemark) {
                    const btnClass = hasRemark ? 'has-remark' : 'required';
                    const btnText = hasRemark ? '📝 แก้ไข' : '✏️ เพิ่ม';
                    html += '<td><button class="remark-btn ' + btnClass + '" onclick="openRemarkPopup(' + emp.id + ')">' + btnText + '</button></td>';
                } else {
                    html += '<td>-</td>';
                }
                
                html += '</tr>';
            }
            
            tbody.innerHTML = html;
        }

        // ==========================================
        // Report Page Rendering
        // ==========================================
        function renderReportPage() {
            const present = employees.filter(function(emp) { return emp.status === 'P'; }).length;
            const leave = employees.filter(function(emp) { return emp.status === 'L'; }).length;
            const absent = employees.filter(function(emp) { return emp.status === 'A'; }).length;
            const late = employees.filter(function(emp) { return emp.status === 'T'; }).length;
            
            document.getElementById('reportSummaryPresent').textContent = present;
            document.getElementById('reportSummaryLeave').textContent = leave;
            document.getElementById('reportSummaryAbsent').textContent = absent;
            document.getElementById('reportSummaryLate').textContent = late;
            
            const tbody = document.getElementById('reportTableBody');
            
            if (employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">ยังไม่มีพนักงานในระบบ</div></div></td></tr>';
                return;
            }
            
            const sortedEmployees = employees.slice().sort(function(a, b) {
                if (a.department !== b.department) {
                    return a.department === 'PRESS_AUTO' ? -1 : 1;
                }
                return a.code.localeCompare(b.code);
            });
            
            let html = '';
            for (let i = 0; i < sortedEmployees.length; i++) {
                const emp = sortedEmployees[i];
                const statusClass = getStatusClass(emp.status);
                const deptName = emp.department === 'PRESS_AUTO' ? 'PRESS Automotive' : 'PRESS HYD';
                
                html += '<tr>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td><span class="code-ellipsis" onclick="openTooltip(' + emp.id + ')">...</span></td>';
                html += '<td>' + escapeHtml(emp.name) + '</td>';
                html += '<td>' + escapeHtml(deptName) + '</td>';
                html += '<td><span class="status-badge ' + statusClass + '">' + escapeHtml(emp.status) + '</span></td>';
                html += '<td>' + escapeHtml(emp.bus) + '</td>';
                html += '<td style="text-align: center;"><input type="checkbox" class="status-checkbox" ';
                html += (emp.checked ? 'checked' : '') + ' ';
                html += 'onchange="updateCheckbox(' + emp.id + ', this.checked)"></td>';
                html += '</tr>';
            }
            
            tbody.innerHTML = html;
        }

        // ==========================================
        // Helper Functions
        // ==========================================
        function getStatusName(status) {
            const names = {
                'P': 'มาทำงาน',
                'L': 'ลา',
                'A': 'ขาด',
                'T': 'มาสาย'
            };
            return names[status] || status;
        }

        function getStatusClass(status) {
            const classes = {
                'P': 'present',
                'L': 'leave',
                'A': 'absent',
                'T': 'late'
            };
            return classes[status] || '';
        }

        function getWorkTypeName(workType) {
            const names = {
                'press': 'Press',
                'help_dept': 'ช่วยแผนก',
                'help_project': 'ช่วยโปร'
            };
            return names[workType] || workType;
        }

        // ==========================================
        // Employee CRUD Operations
        // ==========================================
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'เพิ่มพนักงานใหม่';
            document.getElementById('employeeForm').reset();
            document.getElementById('employeeId').value = '';
            document.getElementById('employeeDepartment').value = currentDept;
            document.getElementById('employeeModal').classList.add('show');
        }

        function editEmployee(id) {
            const emp = employees.find(function(e) { return e.id === id; });
            if (!emp) return;
            
            editingId = id;
            document.getElementById('modalTitle').textContent = 'แก้ไขข้อมูลพนักงาน';
            document.getElementById('employeeId').value = emp.id;
            document.getElementById('employeeCode').value = emp.code;
            document.getElementById('employeeName').value = emp.name;
            document.getElementById('employeeBus').value = emp.bus;
            document.getElementById('employeeDepartment').value = emp.department;
            document.getElementById('employeeModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('employeeModal').classList.remove('show');
            editingId = null;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const code = document.getElementById('employeeCode').value.trim();
            const name = document.getElementById('employeeName').value.trim();
            const bus = document.getElementById('employeeBus').value.trim();
            const department = document.getElementById('employeeDepartment').value;
            
            if (!code || !name || !bus || !department) {
                showToast('⚠️ กรุณากรอกข้อมูลให้ครบทุกช่อง', 'error');
                return;
            }
            
            const duplicateCode = employees.find(function(emp) {
                return emp.code === code && emp.id !== editingId;
            });
            
            if (duplicateCode) {
                showToast('⚠️ รหัสพนักงานนี้มีอยู่แล้วในระบบ', 'error');
                return;
            }
            
            if (editingId) {
                const emp = employees.find(function(e) { return e.id === editingId; });
                if (emp) {
                    emp.code = code;
                    emp.name = name;
                    emp.bus = bus;
                    emp.department = department;
                    emp.updatedAt = new Date().toISOString();
                    showToast('✅ แก้ไขข้อมูลสำเร็จ', 'success');
                }
            } else {
                employees.push({
                    id: nextId++,
                    code: code,
                    name: name,
                    bus: bus,
                    department: department,
                    workType: 'press',
                    ot: '17:00',
                    status: 'P',
                    remark: '',
                    checked: false,
                    updatedAt: new Date().toISOString()
                });
                showToast('✅ เพิ่มพนักงานสำเร็จ', 'success');
            }
            
            saveData();
            closeModal();
            
            if (currentPage === 'ot') {
                renderOTPage();
            } else if (currentPage === 'status') {
                renderStatusPage();
            } else if (currentPage === 'report') {
                renderReportPage();
            }
        }

        // ==========================================
        // Update Functions
        // ==========================================
        function updateWorkType(id, newWorkType) {
            const emp = employees.find(function(e) { return e.id === id; });
            if (emp) {
                emp.workType = newWorkType;
                emp.updatedAt = new Date().toISOString();
                saveData();
                renderOTPage();
                showToast('✅ อัพเดทประเภทงานแล้ว', 'success');
            }
        }

        function updateOT(id, newOT) {
            const emp = employees.find(function(e) { return e.id === id; });
            if (emp) {
                emp.ot = newOT;
                emp.updatedAt = new Date().toISOString();
                saveData();
                renderOTPage();
                showToast('✅ อัพเดท OT แล้ว', 'success');
            }
        }

        function updateStatus(id, newStatus) {
            const emp = employees.find(function(e) { return e.id === id; });
            if (!emp) return;
            
            const needsRemark = newStatus === 'L' || newStatus === 'A' || newStatus === 'T';
            
            // If changing to a status that needs remark and no remark exists, open popup
            if (needsRemark && !emp.remark.trim()) {
                emp.status = newStatus;
                saveData();
                renderStatusPage();
                openRemarkPopup(id);
                showToast('⚠️ กรุณากรอกหมายเหตุ', 'error');
                return;
            }
            
            emp.status = newStatus;
            
            if (newStatus === 'P') {
                emp.remark = '';
            }
            
            emp.updatedAt = new Date().toISOString();
            saveData();
            renderStatusPage();
            
            if (currentPage === 'ot') {
                renderOTPage();
            }
            
            showToast('✅ เปลี่ยนสถานะเป็น ' + getStatusName(newStatus) + ' แล้ว', 'success');
        }

        function updateCheckbox(id, checked) {
            const emp = employees.find(function(e) { return e.id === id; });
            if (emp) {
                emp.checked = checked;
                emp.updatedAt = new Date().toISOString();
                saveData();
            }
        }

        // ==========================================
        // Toast Notification
        // ==========================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const messageEl = document.getElementById('toastMessage');
            
            toast.className = 'toast ' + type;
            icon.textContent = type === 'success' ? '✅' : '⚠️';
            messageEl.textContent = message;
            
            toast.classList.add('show');
            
            setTimeout(function() {
                toast.classList.remove('show');
            }, 3500);
        }

        // ==========================================
        // Initialize App
        // ==========================================
        async function initializeApp() {
            await loadData();
            renderOTPage();
        }

        initializeApp();
    </script>
